name: Update README Version

on:
  push:
    paths:
      - 'config.yaml' # Se dispara cuando detecta cambios en tu YAML

jobs:
  sync-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer versión desde config.yaml
        id: get_version
        run: |
          # Busca 'version:' ignorando mayúsculas/minúsculas y limpia comillas
          VERSION=$(grep -i 'version:' config.yaml | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Nueva versión detectada: $VERSION"

      - name: Actualizar README.adoc
        run: |
          # Actualiza el atributo :project-version: en el README
          # El ^ asegura que solo cambie si la línea empieza con eso
          sed -i "s/^:project-version:.*/:project-version: ${{ env.VERSION }}/" README.adoc

      - name: Commit y Push de cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet README.adoc; then
            echo "La versión ya estaba actualizada."
          else
            git add README.adoc
            git commit -m "chore: saltar a versión v${{ env.VERSION }} en README"
            git push
          fi